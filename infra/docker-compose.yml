services:
  postgres:
    image: postgres:16-alpine
    container_name: oauth-postgres
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth_secret
      POSTGRES_DB: oauth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth_service"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
